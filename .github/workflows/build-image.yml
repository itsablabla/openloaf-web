name: Build and publish OpenLoaf web-mode image

on:
  push:
    branches: [web-mode]
    paths:
      - "apps/**"
      - "packages/**"
      - "services/**"
      - "Dockerfile.web"
      - ".dockerignore"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:

concurrency:
  group: openloaf-web-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha_tag: ${{ steps.shatag.outputs.tag }}
    steps:
      - name: Free up runner disk (image is large)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          docker system prune -af --volumes || true
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/openloaf-web
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/web-mode' }}
            type=sha,prefix=,format=short

      - name: Export short-sha tag
        id: shatag
        run: echo "tag=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.web
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

  # ──────────────────────────────────────────────────────────────
  # Run the EXACT image the same way Coolify will: named volume on
  # /root/.openloaf, port 8080. Fail loudly with full container logs
  # if it doesn't come up. Coolify never sees an image that failed here.
  smoke-test:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ghcr.io/${{ github.repository_owner }}/openloaf-web:${{ needs.build.outputs.sha_tag }}

      - name: Start container (Coolify-equivalent config)
        run: |
          docker volume create openloaf-data
          docker run -d --name openloaf \
            -v openloaf-data:/root/.openloaf \
            -p 8080:8080 \
            -e PORT=8080 \
            ghcr.io/${{ github.repository_owner }}/openloaf-web:${{ needs.build.outputs.sha_tag }}

      - name: Wait for static UI AND API server (max 8 min)
        run: |
          static_ok=""; api_ok=""
          for i in $(seq 1 96); do
            sleep 5
            state=$(docker inspect -f '{{.State.Status}} {{.State.ExitCode}}' openloaf 2>/dev/null || echo gone)
            s=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:8080/ || true)
            a=$(curl -s -o /dev/null -w '%{http_code}' --max-time 4 http://127.0.0.1:8080/api/health || true)
            echo "[$((i*5))s] container=$state static=$s api=$a"
            [ "$s" = "200" ] && static_ok=1
            # ANY response except 502 (proxy: server down) / 000 proves the
            # Hono server process is alive and listening.
            case "$a" in 200|204|301|302|401|404) api_ok=1;; esac
            if [ -n "$static_ok" ] && [ -n "$api_ok" ]; then
              echo "UP after $((i*5))s (static=$s api=$a)"; exit 0
            fi
            case "$state" in
              exited*|dead*|gone)
                echo "::error::container died: $state"; exit 1;;
            esac
          done
          echo "::error::static=$static_ok api=$api_ok — not both up within 8 min"
          exit 1

      - name: Assert server runs from dist (not tsx fallback) and no crash loop
        run: |
          logs=$(docker logs openloaf 2>&1)
          if echo "$logs" | grep -q 'server/dist/index.js'; then
            echo "OK: server started from esbuild dist"
          else
            echo '::error::server did not start from apps/server/dist/index.js'
            exit 1
          fi
          crashes=$(echo "$logs" | grep -c '\[server\] exited' || true)
          if [ "$crashes" -gt 1 ]; then
            echo "::error::server crashed $crashes times"
            exit 1
          fi

      - name: Container logs (always)
        if: always()
        run: |
          echo "=== docker logs (last 300 lines) ==="
          docker logs --tail 300 openloaf 2>&1 || true
          echo "=== docker inspect state ==="
          docker inspect -f '{{json .State}}' openloaf 2>/dev/null || true

  # ──────────────────────────────────────────────────────────────
  deploy:
    needs: [build, smoke-test]
    if: github.ref == 'refs/heads/web-mode'
    runs-on: ubuntu-latest
    steps:
      - name: Notify Coolify to redeploy
        env:
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_URL" ] || [ -z "$COOLIFY_APP_UUID" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Coolify variables not configured; skipping auto-redeploy."
            exit 0
          fi
          curl -fsSL -X POST "$COOLIFY_URL/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\":\"$COOLIFY_APP_UUID\",\"force\":true}"
